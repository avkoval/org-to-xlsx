[project]
name = "org-to-xlsx"
version = "0.1.0"
description = "Extract org-mode tables into a multi-sheet xlsx workbook."
requires-python = ">=3.11"
authors = [{ name = "Oleksii Koval" }]
dependencies = [
    "orgparse>=0.4.20231004",
    "xlsxwriter>=3.2.0",
]

[project.scripts]
org-to-xlsx = "org_to_xlsx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/org_to_xlsx"]
